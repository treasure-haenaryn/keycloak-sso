# oauth2-proxy config for member-cms.
# This process is the ONLY thing allowed to reach member-cms directly (see docker-compose.yml
# network setup) - it performs the OIDC dance with Keycloak on member-cms's behalf and forwards
# a pre-verified identity header to the (SSO-unaware) legacy app behind it.

http_address = "0.0.0.0:4180"
upstreams = ["http://member-cms:8080/"]

provider = "keycloak-oidc"
oidc_issuer_url = "http://idp.local:8080/realms/sso-poc"
client_id = "member-cms-proxy"
client_secret = "member-cms-secret"
redirect_url = "http://localhost:4181/oauth2/callback"

# oauth2-proxy's keycloak-oidc provider requests a "groups" OAuth scope by default, but
# Keycloak doesn't have (and doesn't need) a client scope literally named "groups" - the
# group-membership claim is already included via the client's own dedicated protocol
# mapper regardless of scope negotiation. Requesting an unregistered scope makes Keycloak
# reject the whole auth request (invalid_scope), so we override the scope list explicitly.
scope = "openid email profile"

# Defense-in-depth even though this is a confidential client (has a client_secret) -
# current OAuth guidance (OAuth 2.1 direction) recommends PKCE regardless of client type,
# since it also protects the authorization code itself from interception, not just from
# a missing client_secret.
code_challenge_method = "S256"

# Authorization gate: only members of this Keycloak group get forwarded to the app at all.
# The exact "groups" claim format Keycloak emits (leading slash, full path vs name) must
# match this value exactly, or the match silently fails - verify with both an in-group and
# an out-of-group test user before relying on this for real access control.
allowed_groups = ["/member-cms-users"]

# Which token claim becomes the "email" field (and therefore the X-Forwarded-Email header
# oauth2-proxy forwards to the app - NOT X-Forwarded-User, which always carries Keycloak's
# raw sub/UUID regardless of this setting). This is what actually implements the per-app
# username mapping.
# NOTE: --user-id-claim is DEPRECATED in oauth2-proxy v7.15+ in favor of this flag
# (confusingly still named "email claim" even though it's the general identity-claim
# setting now).
oidc_email_claim = "member_cms_username"

email_domains = ["*"]
cookie_secret = "aLW51k25h9b5nEyxFZf0sfMF8GNPJbk1UZoW9ShP9bI="
# Local-toy-only: this is false because the toy has no TLS anywhere. The moment there's
# real TLS in front of this (any non-local environment), this MUST become true, or the
# session cookie is exposed on any plain-HTTP connection.
cookie_secure = false
cookie_expire = "3h"

# Without this (default: disabled), oauth2-proxy never re-checks with Keycloak during
# cookie_expire's 3h window - it just trusts its own cached session regardless of the
# access token's actual 90s lifespan. Set below that lifespan so a disabled account or
# revoked session actually gets cut off within ~1 access-token-lifespan of the change,
# instead of silently working for up to 3 more hours.
cookie_refresh = "60s"

pass_user_headers = true
set_xauthrequest = true
skip_provider_button = true

# Without this, /oauth2/sign_out only clears oauth2-proxy's own cookie - Keycloak's SSO
# session survives, so the very next request silently re-authenticates with no password
# prompt. This makes oauth2-proxy call Keycloak's end_session_endpoint server-to-server on
# sign_out, actually killing the SSO session (which is what propagates the logout to
# payment-cms/modern-cms too).
backend_logout_url = "http://idp.local:8080/realms/sso-poc/protocol/openid-connect/logout?id_token_hint={id_token}"
