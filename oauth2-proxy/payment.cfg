# oauth2-proxy config for payment-cms.
# Mirrors member.cfg with different client + claim + group - see that file's comments for
# the reasoning. Deliberately not shared/templated: payment-cms and member-cms represent two
# independently-owned legacy systems in real life, so their config isn't factored together.

http_address = "0.0.0.0:4180"
upstreams = ["http://payment-cms:8080/"]

provider = "keycloak-oidc"
oidc_issuer_url = "http://idp.local:8080/realms/sso-poc"
client_id = "payment-cms-proxy"
client_secret = "payment-cms-secret"
redirect_url = "http://localhost:4182/oauth2/callback"

# See member.cfg for why this override is needed.
scope = "openid email profile"

# Authorization gate - only members of this group get forwarded to the app.
allowed_groups = ["/payment-cms-users"]

# See member.cfg for why this is oidc_email_claim (-> X-Forwarded-Email) and not user_id_claim.
oidc_email_claim = "payment_cms_username"

email_domains = ["*"]
cookie_secret = "FP86YG52vtm0rEaFxCk0m0jFryez7mNmxgpMGveIhq0="
cookie_secure = false
cookie_expire = "3h"

pass_user_headers = true
set_xauthrequest = true
skip_provider_button = true

# See member.cfg for why this is required (real-quality logout).
backend_logout_url = "http://idp.local:8080/realms/sso-poc/protocol/openid-connect/logout?id_token_hint={id_token}"
