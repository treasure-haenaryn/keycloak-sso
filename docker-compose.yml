networks:
  # One network per app+proxy pair, instead of one flat network for everything.
  # A flat network means any sibling container (e.g. modern-cms) can reach another
  # app's backend port directly and forge trust headers, since Docker doesn't ACL
  # traffic between containers on the same network by default - "no ports: published"
  # only blocks access from outside the Docker host, not from other containers.
  # Splitting networks so each backend only shares a network with its own proxy (and
  # Keycloak, which every consumer needs to reach) closes that gap structurally.
  member-net:
    driver: bridge
  payment-net:
    driver: bridge
  modern-net:
    driver: bridge
  kc-db-net:
    driver: bridge

volumes:
  keycloak-db-data:

services:
  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      # Plain-text password is fine for a local toy only - a real deployment must pull
      # this from a secrets manager instead of a file checked into git.
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kc-db-net

  keycloak:
    build: ./keycloak
    # Still start-dev (not the production "start" command) so HTTP/hostname config stays
    # as-is - only the storage backend changes here, from the embedded dev H2 to a real
    # external Postgres, which is what production actually requires.
    command: ["start-dev", "--import-realm"]
    environment:
      # Hedging both old and new admin-bootstrap env var names since the exact
      # ones depend on the Keycloak version actually pulled - harmless either way.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: idp.local
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Keycloak has to sit on every app-facing network (each proxy/app needs to reach
    # it), but each backend app only sits on its own network - so keycloak can reach
    # member-cms, but modern-cms/payment-cms cannot.
    networks:
      member-net:
        aliases:
          - idp.local
      payment-net:
        aliases:
          - idp.local
      modern-net:
        aliases:
          - idp.local
      kc-db-net: {}

  member-cms:
    build: ./member-cms
    networks:
      - member-net
    # No "ports:" on purpose, and member-net has no other tenant besides
    # oauth2-proxy-member and keycloak - nothing else on the compose file can reach
    # this container at all, let alone forge a trust header at it.

  payment-cms:
    build: ./payment-cms
    networks:
      - payment-net
    # Same as above, on payment-net.

  oauth2-proxy-member:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    command: ["--config=/etc/oauth2-proxy.cfg"]
    volumes:
      - ./oauth2-proxy/member.cfg:/etc/oauth2-proxy.cfg:ro
    ports:
      - "4181:4180"
    depends_on:
      - keycloak
      - member-cms
    # keycloak's HTTP endpoint isn't up the instant its container starts (start-dev takes
    # a while to boot + import the realm) - depends_on only waits for the container to
    # start, not for Keycloak itself to be ready, so this retries OIDC discovery until it is.
    restart: on-failure:10
    networks:
      - member-net

  oauth2-proxy-payment:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    command: ["--config=/etc/oauth2-proxy.cfg"]
    volumes:
      - ./oauth2-proxy/payment.cfg:/etc/oauth2-proxy.cfg:ro
    ports:
      - "4182:4180"
    depends_on:
      - keycloak
      - payment-cms
    restart: on-failure:10
    networks:
      - payment-net

  modern-cms:
    build: ./modern-cms
    ports:
      - "8083:8083"
    depends_on:
      - keycloak
    # Same reason as the oauth2-proxy services above - Spring's OIDC client fetches
    # issuer metadata from Keycloak at startup and fails fast if it's not ready yet.
    restart: on-failure:10
    networks:
      - modern-net
